# 법령 API 시험 (2026-11-21 묶음 E1·E2, 손으로만 실행): 조례 표를 만들어 보고 결과 파일만 내려받게 둔다(배포 안 함).
# 인증값은 저장소 비밀 값 LAW_OC(사용자가 직접 넣음)에서만 읽고, 로그에는 지자체별 건수·문제만 남긴다.
# 시험 결과(2026-11-21): 그냥 부르면 거절, 사이트 주소(등록한 도메인 cjg10040.github.io)를 밝히면 통과 → 사용자 결정으로 밝혀서 부름.
name: 법령 API 시험 (수동)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 조례 표 만들기 (37곳)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python3 tools/law/update_ordinances.py --out ordinances.json --force
      - uses: actions/upload-artifact@v4
        with:
          name: ordinances
          path: ordinances.json
          retention-days: 3
