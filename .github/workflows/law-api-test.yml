# 법령 API 시험 (2026-11-21 묶음 E1, 손으로만 실행): 국가법령정보센터 공식 API가 GitHub에서 불러지는지 확인.
# 인증값은 저장소 비밀 값 LAW_OC(사용자가 직접 넣음)에서만 읽고, 로그에는 답 메시지·건수·조례 이름·조문 제목만 남긴다.
# 시험 결과(2026-11-21): 그냥 부르면 거절, 사이트 주소(등록한 도메인 cjg10040.github.io)를 밝히면 통과 → 사용자 결정으로 밝혀서 부름.
# 2차: 광주·전남 통합(전남광주통합특별시) 뒤 조례 이름·지자체 이름, 별표(대지 안의 공지) 글 확인.
name: 법령 API 시험 (수동)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 통합 뒤 조례 이름·별표 확인
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        shell: python
        run: |
          import os, re, sys, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET

          OC = os.environ.get('LAW_OC', '')
          if not OC:
              sys.exit('비밀 값 LAW_OC가 없습니다')
          HEAD = {'Referer': 'https://cjg10040.github.io/site-agent/', 'User-Agent': 'site-agent-law-table'}

          def get(path, **q):
              q = {'OC': OC, 'type': 'XML', **q}
              req = urllib.request.Request(f'https://www.law.go.kr/DRF/{path}?' + urllib.parse.urlencode(q), headers=HEAD)
              with urllib.request.urlopen(req, timeout=40) as r:
                  return ET.fromstring(r.read())

          def search(q, n=30):
              s = get('lawSearch.do', target='ordin', query=q, display=n)
              return s.findtext('totalCnt'), [(i.findtext('자치법규명'), i.findtext('지자체기관명'), i.findtext('시행일자'), i.findtext('자치법규일련번호')) for i in s.findall('.//law')]

          # 1) 이름에 '도시계획 조례'·'군계획 조례'·'건축 조례'가 들어간 것 중 통합특별시·전남·전북
          for q in ['전남광주통합특별시 도시계획 조례', '전남광주통합특별시 건축 조례', '통합특별시 조례 경과조치', '목포시 도시계획 조례', '담양군 군계획 조례', '전주시 도시계획 조례', '진안군 군계획 조례', '전라남도 건축 조례']:
              cnt, rows = search(q)
              print(f'== {q}: {cnt}')
              for r in rows[:12]:
                  print('   ', r[0], '|', r[1], '|', r[2], '|', r[3])

          # 2) 광주 건축 조례 별표(대지안의 공지) 글
          b = get('lawService.do', target='ordin', MST='2084489')
          for u in b.findall('.//별표단위'):
              t = (u.findtext('별표제목') or '').strip()
              body = ' '.join((u.findtext('별표내용') or '').split())
              print('   별표', u.findtext('별표번호'), t[:60], '| 글 길이', len(body), '| 파일', u.findtext('별표첨부파일구분'))
              if '공지' in t:
                  print('     ', body[:900])
